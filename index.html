<!doctype html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menagerie — a chat UI with an animal at the keyboard</title>
<meta name="description" content="A chat interface for local and hosted LLMs where a pixel animal does the typing. Ollama, any OpenAI-compatible server, or the Anthropic API. One HTML file, no build step.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23e2703a'/><rect x='4' y='5' width='2' height='2' fill='%23fff'/><rect x='10' y='5' width='2' height='2' fill='%23fff'/><rect x='5' y='9' width='6' height='2' fill='%23fff'/></svg>">
<style>
:root{
  --bg:#f4f0e8; --bg-grid:#e2dbcd; --panel:#fffdf8; --panel-2:#f7f2e8;
  --ink:#231f1a; --ink-2:#5d564c; --ink-3:#8c8375;
  --line:#ded5c4; --line-2:#c9bfab;
  --accent:#c85a2a; --accent-soft:#f7e4d8; --accent-ink:#8a3a17;
  --bubble:#fffdf8; --bubble-self:#f2e6d8;
  --screen:#141a17; --screen-ink:#8ee6b0; --screen-dim:#4e7a63; --screen-line:#22302a;
  --ok:#3f8f5f; --bad:#c0392b;
  --shadow:0 1px 0 rgba(35,31,26,.05), 0 6px 18px -10px rgba(35,31,26,.35);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14120f; --bg-grid:#211d18; --panel:#1c1917; --panel-2:#232019;
    --ink:#f0e9dd; --ink-2:#b6ac9c; --ink-3:#7e7466;
    --line:#302a23; --line-2:#453d33;
    --accent:#e8823f; --accent-soft:#3a2417; --accent-ink:#f3b183;
    --bubble:#241f1b; --bubble-self:#332a20;
    --screen:#0d1210; --screen-ink:#7fe0a4; --screen-dim:#48705c; --screen-line:#1b2622;
    --ok:#6cc48a; --bad:#ff8a7a;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#14120f; --bg-grid:#211d18; --panel:#1c1917; --panel-2:#232019;
  --ink:#f0e9dd; --ink-2:#b6ac9c; --ink-3:#7e7466;
  --line:#302a23; --line-2:#453d33;
  --accent:#e8823f; --accent-soft:#3a2417; --accent-ink:#f3b183;
  --bubble:#241f1b; --bubble-self:#332a20;
  --screen:#0d1210; --screen-ink:#7fe0a4; --screen-dim:#48705c; --screen-line:#1b2622;
  --ok:#6cc48a; --bad:#ff8a7a;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);color:var(--ink);
  background-color:var(--bg);
  background-image:radial-gradient(var(--bg-grid) 1px, transparent 1px);
  background-size:8px 8px;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.app{display:flex;flex-direction:column;height:100dvh}

/* ---------- header ---------- */
header.bar{
  display:flex;align-items:center;gap:9px;padding:9px 13px;
  border-bottom:1px solid var(--line);background:var(--panel);
  flex:0 0 auto;position:relative;z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand canvas{width:32px;height:32px;flex:0 0 auto}
.brand h1{
  font-size:14px;margin:0;letter-spacing:.15em;text-transform:uppercase;
  font-family:var(--mono);font-weight:600;white-space:nowrap;
}
@media (max-width:900px){.brand h1{display:none}}
.grow{margin-left:auto}

.pill{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
  font-family:var(--mono);padding:5px 9px;border-radius:99px;
  border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink-2);
  cursor:pointer;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis;
}
.pill:hover{border-color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.dot.on{background:var(--ok)}
.dot.off{background:var(--bad)}
.dot.demo{background:var(--accent)}

.btn{
  border:1px solid var(--line-2);background:var(--panel-2);
  padding:7px 11px;border-radius:9px;cursor:pointer;
  font-size:12.5px;font-weight:550;line-height:1;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:background .12s ease,border-color .12s ease,transform .06s ease;
}
.btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn.icon{padding:7px 9px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- layout ---------- */
.split{display:flex;flex:1 1 auto;min-height:0}
main.chat{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
.scroll{overflow-y:auto;flex:1 1 auto;padding:20px 0 6px}
.sheet{max-width:740px;margin:0 auto;padding:0 22px}

/* ---------- messages ---------- */
.msg{display:flex;gap:11px;margin-bottom:18px;align-items:flex-start}
.msg .av{width:48px;height:48px;flex:0 0 auto;border:none;background:none;padding:0;cursor:pointer;border-radius:10px}
.msg .av canvas{width:100%;height:100%;display:block}
.msg .av:hover{background:var(--accent-soft)}
.msg .body{min-width:0;flex:1 1 auto}
.who{font-size:11px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.06em;margin:2px 0 4px}
.msg.user{flex-direction:row-reverse}
.msg.user .body{max-width:min(80%,560px);margin-left:auto}
.msg.user .who{text-align:right}
.msg.user .bubble{background:var(--bubble-self);border-bottom-right-radius:4px}
.bubble{
  background:var(--bubble);border:1px solid var(--line);border-radius:14px;
  border-bottom-left-radius:4px;padding:11px 15px;font-size:15px;line-height:1.62;
  box-shadow:var(--shadow);word-wrap:break-word;overflow-wrap:anywhere;
}
.bubble.err{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 8%, var(--bubble))}
.you-chip{
  width:48px;height:48px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-3);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;
}

/* markdown inside a bubble */
.bubble p{margin:0 0 .7em}
.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3{font-size:1.03em;margin:1em 0 .45em;line-height:1.35}
.bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child{margin-top:0}
.bubble ul,.bubble ol{margin:.2em 0 .8em;padding-left:1.3em}
.bubble li{margin:.18em 0}
.bubble a{color:var(--accent-ink);text-underline-offset:2px}
.bubble code{
  font-family:var(--mono);font-size:.87em;background:var(--panel-2);
  border:1px solid var(--line);border-radius:5px;padding:1px 4px;
}
.bubble blockquote{
  margin:.4em 0;padding-left:.8em;border-left:2px solid var(--line-2);color:var(--ink-2);
}
.code{
  position:relative;margin:.6em 0;border:1px solid var(--screen-line);
  border-radius:10px;background:var(--screen);overflow:hidden;
}
.code pre{
  margin:0;padding:11px 13px;overflow-x:auto;
  font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--screen-ink);
}
.code pre code{background:none;border:none;padding:0;font-size:inherit;color:inherit}
.code .lang{
  position:absolute;top:0;right:0;font-family:var(--mono);font-size:10px;
  color:var(--screen-dim);padding:5px 8px;letter-spacing:.08em;text-transform:uppercase;
}
.code .cp{
  position:absolute;top:5px;right:6px;opacity:0;transition:opacity .12s ease;
  border:1px solid var(--screen-line);background:var(--screen);color:var(--screen-dim);
  font-family:var(--mono);font-size:10.5px;padding:3px 7px;border-radius:6px;cursor:pointer;
}
.code:hover .cp{opacity:1}
.code:hover .lang{opacity:0}
.code .cp:hover{color:var(--screen-ink)}

.cursor{
  display:inline-block;width:.55em;height:1.02em;vertical-align:-2px;
  background:var(--accent);margin-left:2px;animation:blink 1.05s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}

.empty{text-align:center;color:var(--ink-3);padding:40px 20px 10px;font-size:14px;line-height:1.75}
.starters{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:16px}
.starter{
  border:1px solid var(--line-2);background:var(--panel);border-radius:99px;
  padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--ink-2);
}
.starter:hover{border-color:var(--accent);color:var(--ink)}

/* ---------- composer ---------- */
.composer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);padding:10px 22px 12px}
.composer-inner{max-width:740px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.say{
  flex:1 1 auto;resize:none;border:1px solid var(--line-2);border-radius:12px;
  background:var(--panel-2);padding:11px 13px;font-size:15px;line-height:1.45;
  max-height:190px;min-height:44px;
}
.say:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.hint{max-width:740px;margin:6px auto 0;font-size:11px;color:var(--ink-3);font-family:var(--mono)}

/* ---------- the den ---------- */
aside.den{
  width:346px;flex:0 0 346px;border-left:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0;
}
.den-head{
  display:flex;align-items:center;gap:8px;padding:11px 13px 0;
}
.den-head h2{
  margin:0;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);font-family:var(--mono);font-weight:600;margin-right:auto;
}
.status{font-size:10.5px;font-family:var(--mono);color:var(--ink-3);letter-spacing:.04em}
.status.work{color:var(--accent)}
.status.happy{color:var(--ok)}
.status.fight{color:var(--bad)}

.laptop{margin:9px 13px 0;display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.screen{
  background:var(--screen);border:1px solid var(--screen-line);border-radius:10px 10px 3px 3px;
  padding:10px 11px;overflow-y:auto;flex:1 1 auto;min-height:120px;
  font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--screen-ink);
  white-space:pre-wrap;word-break:break-word;
}
.screen .think{color:var(--screen-dim);font-style:italic}
.screen .note{color:var(--screen-dim)}
.screen .bad{color:#ff8a7a}
.screen b{color:#fff;font-weight:600}
.hinge{
  height:9px;background:linear-gradient(var(--line-2),var(--line));
  border:1px solid var(--line-2);border-top:none;border-radius:0 0 8px 8px;
  margin:0 6px;position:relative;
}
.hinge::after{
  content:"";position:absolute;left:50%;top:3px;width:34px;height:2px;margin-left:-17px;
  background:var(--panel);border-radius:2px;
}

.stage{position:relative;height:190px;flex:0 0 auto;display:grid;place-items:center;overflow:hidden}
.stage canvas{cursor:pointer;display:block}
.pop{
  position:absolute;top:12px;left:50%;transform:translate(-50%,-6px);
  background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:11px;
  padding:5px 10px;border-radius:99px;opacity:0;pointer-events:none;
  transition:opacity .18s ease, transform .18s ease;white-space:nowrap;
}
.pop.on{opacity:1;transform:translate(-50%,0)}

.picker{padding:0 13px 8px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.pk{
  border:1px solid transparent;background:none;padding:1px;border-radius:9px;
  cursor:pointer;line-height:0;opacity:.45;transition:opacity .12s ease,background .12s ease;
}
.pk canvas{width:32px;height:32px}
.pk:hover{opacity:.9;background:var(--panel-2)}
.pk[aria-pressed="true"]{opacity:1;background:var(--accent-soft);border-color:var(--accent)}
.props{padding:0 13px 12px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.chip{
  border:1px solid var(--line-2);background:var(--panel);border-radius:99px;
  padding:3px 9px;font-size:10.5px;cursor:pointer;font-family:var(--mono);color:var(--ink-2);
}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- settings sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none}
.scrim.on{display:block}
.sheet-panel{
  position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);z-index:41;
  background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(101%);transition:transform .22s ease;
  display:flex;flex-direction:column;
}
.sheet-panel.on{transform:none}
.sheet-head{display:flex;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono);margin-right:auto}
.sheet-body{overflow-y:auto;padding:15px;flex:1 1 auto}
.field{margin-bottom:15px}
.field label{
  display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-family:var(--mono);margin-bottom:6px;font-weight:600;
}
.field .note{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.5}
.field .note code{font-family:var(--mono);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 4px;font-size:11px}
.in{
  width:100%;border:1px solid var(--line-2);border-radius:9px;
  background:var(--panel-2);padding:9px 11px;font-size:13.5px;
}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea.in{resize:vertical;min-height:74px;font-size:13px;line-height:1.5}
.seg{display:flex;gap:4px}
.seg button{
  flex:1 1 0;border:1px solid var(--line-2);background:var(--panel-2);
  border-radius:9px;padding:9px 6px;cursor:pointer;font-size:12.5px;
}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.row2{display:flex;gap:8px}
.row2 > *{flex:1 1 0;min-width:0}
.warn{
  border:1px solid var(--line-2);background:var(--panel-2);border-radius:10px;
  padding:10px 12px;font-size:11.5px;line-height:1.6;color:var(--ink-2);
}
.warn b{color:var(--ink)}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);
  background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:99px;
  font-size:13px;font-weight:550;opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;z-index:60;box-shadow:var(--shadow);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- narrow ---------- */
.den-toggle{display:none}
@media (max-width:900px){
  .den-toggle{display:inline-flex}
  aside.den{
    position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(346px,86vw);flex-basis:auto;
    transform:translateX(101%);transition:transform .22s ease;box-shadow:0 0 40px -8px rgba(0,0,0,.45);
  }
  aside.den.on{transform:none}
  .sheet{padding:0 15px}
  .composer{padding:9px 15px 11px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="brand">
      <canvas id="logo" aria-hidden="true"></canvas>
      <h1>Menagerie</h1>
    </div>
    <button class="pill grow" id="statusPill" title="Where replies come from">
      <span class="dot" id="statusDot"></span><span id="statusText">looking…</span>
    </button>
    <button class="btn den-toggle" id="denToggle">Den</button>
    <button class="btn ghost icon" id="newBtn" title="Start a new conversation">New</button>
    <button class="btn ghost icon" id="themeBtn" title="Switch theme">◐</button>
    <button class="btn icon" id="setBtn" title="Settings">⚙</button>
  </header>

  <div class="split">
    <main class="chat">
      <div class="scroll" id="scroll">
        <div class="sheet"><div id="msgs"></div></div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <textarea class="say" id="say" rows="1" placeholder="Ask for something…"></textarea>
          <button class="btn primary" id="sendBtn">Send</button>
        </div>
        <div class="hint" id="hint">Enter to send · Shift+Enter for a new line</div>
      </div>
    </main>

    <aside class="den" id="den">
      <div class="den-head">
        <h2>The den</h2>
        <span class="status" id="statusLine">asleep</span>
      </div>
      <div class="laptop">
        <div class="screen" id="screen"></div>
        <div class="hinge"></div>
      </div>
      <div class="stage" id="stage">
        <canvas id="stageCv"></canvas>
        <div class="pop" id="pop"></div>
      </div>
      <div class="picker" id="picker"></div>
      <div class="props" id="props"></div>
    </aside>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet-panel" id="settings">
  <div class="sheet-head">
    <h2>Settings</h2>
    <button class="btn ghost icon" id="setClose">✕</button>
  </div>
  <div class="sheet-body" id="setBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================
   Menagerie — a chat UI for local and hosted models, staffed by animals.
   One file: sprites, animation, three API clients, markdown, the lot.
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. SPRITES
   16x16 grids, one letter per pixel:
     .  transparent   O outline   B body      S torso/shade
     L  light/belly   A accent    E eye       W white
     M  mouth/nose/beak           K near-black
   Rows 0-9 are the head, 10-15 the body — the animator moves them apart.
--------------------------------------------------------------------- */
const SPECIES = {
  clawd: { label:"Clawd", move:"rise", fx:"star", cry:"Ta-da", px:[
    "....O..OO..O....","...OBOOBBOOBO...","..OOBBBBBBBBOO..",".OBBBBBBBBBBBBO.",
    "OBBBBBBBBBBBBBBO","OBBEEBBBBBBEEBBO",".OBEEBBBBBBEEBO.","..OBBBBBBBBBBO..",
    "..OBBLMMMMLBBO..","...OOBBBBBBOO...","....OSSSSSSO....","..OOSSSSSSSSOO..",
    "..OBSSSSSSSSBO..","...OSSSSSSSSO...","....OBBO.OBBO...","................"],
    pal:{B:[26,85,63],S:[24,78,53],L:[34,85,90],A:[20,80,55],M:[8,50,42]} },

  dino: { label:"Dino", move:"stomp", fx:"star", cry:"Stomp", px:[
    ".....O....O.....","....OAOOOOAO....","..OOBBBBBBBBOO..","..OBBBBBBBBBBO..",
    "..OBBBBBBBBBBO..","..OBEEBBBBEEBO..","..OBEEBBBBEEBO..","..OBBLLLLLLBBO..",
    "..OBLWWLLWWLBO..","...OOLLLLLLOO...","....OSSSSSSO....","..OOSSSSSSSSOO..",
    "..OBSSSSSSSSBO..","...OSSSSSSSSO...","....OBBO.OBBO...","................"],
    pal:{B:[128,45,50],S:[128,42,42],L:[80,55,75],A:[100,50,62],M:[350,50,60]} },

  tiger: { label:"Tiger", move:"spin", fx:"dash", cry:"Whirl", px:[
    "................","..OOO......OOO..",".OBBBOOOOOOBBBO.","..OOBBBBBBBBOO..",
    "..OABBBBBBBBAO..","..OBEEBBBBEEBO..","..OBEEBBBBEEBO..","..OBALLLLLLABO..",
    "..OBLLMMMMLLBO..","...OOLLLLLLOO...","....OSSSSSSO....","..OOSASSSSASOO..",
    "..OBSSSSSSSSBO..","...OSASSSSASO...","....OBBO.OBBO...","................"],
    pal:{B:[28,88,58],S:[28,80,50],L:[40,60,93],A:[24,25,16],M:[350,45,58]} },

  human: { label:"Human", move:"lean", fx:"note", cry:"Hey", px:[
    "................","....AAAAAAAA....","..AAAAAAAAAAAA..","..ABBBBBBBBBBA..",
    "..ABBBBBBBBBBA..","..OBEEBBBBEEBO..","..OBBBBBBBBBBO..","..OBBBBMMBBBBO..",
    "..OBBBLMMLBBBO..","...OOBBBBBBOO...","....OSSSSSSO....","..OOSSSSSSSSOO..",
    "..OBSSSSSSSSBO..","...OSSSSSSSSO...","....OBBO.OBBO...","................"],
    pal:{B:[26,55,74],S:[210,55,52],L:[26,50,84],A:[28,45,26],M:[8,45,52]},
    hue:["S","A"] },

/* ---------------------------------------------------------------------
   2. DRAWING
   Colours live in HSL so one hue dial can walk a whole palette around.
   The animator splits the grid at row 10: head above, body below, each
   offset independently, with a shear that leans the top without ever
   breaking the pixel grid.
--------------------------------------------------------------------- */
const hsl = (h,s,l) => "hsl(" + (((h % 360) + 360) % 360) + " " + s + "% " + l + "%)";
const HEAD_ROWS = 10;

function paletteFor(m){
  const sp = SPECIES[m.species] || SPECIES.clawd;
  const shift = sp.hue || ["B","S","L","A"];
  const d = m.hue || 0;
  const p = {};
  for (const k in sp.pal){
    const c = sp.pal[k];
    p[k] = hsl(c[0] + (shift.indexOf(k) >= 0 ? d : 0), c[1], c[2]);
  }
  const b = sp.pal.B;
  p.O = hsl(b[0] + (shift.indexOf("B") >= 0 ? d : 0), Math.min(58, b[1]), Math.max(11, Math.round(b[2] * 0.30)));
  p.E = "#20242e"; p.W = "#fbf7ef"; p.K = "#191b21";
  return p;
}

const FLAT = { hx:0, hy:0, bx:0, by:0, shear:0 };

function stamp(ctx, px, pal, scale, ox, oy, pose){
  /* poses arrive partial - {hy:-1} and nothing else - so fill the gaps
     here rather than making every mood spell out five zeroes. */
  const p = pose || FLAT;
  const hx = p.hx || 0, hy = p.hy || 0, bx = p.bx || 0, by = p.by || 0, sh = p.shear || 0;
  for (let y = 0; y < px.length; y++){
    const row = px[y];
    const head = y < HEAD_ROWS;
    const lean = Math.round(((15 - y) / 15) * sh);
    const dx = (head ? hx : bx) + lean;
    const dy = head ? hy : by;
    for (let x = 0; x < row.length; x++){
      const ch = row[x];
      if (ch === "." || !pal[ch]) continue;
      ctx.fillStyle = pal[ch];
      ctx.fillRect((ox + x + dx) * scale, (oy + y + dy) * scale, scale, scale);
    }
  }
}

function paintMember(ctx, m, scale, ox, oy, pose){
  const acc = m.acc || [];
  stamp(ctx, (SPECIES[m.species] || SPECIES.clawd).px, paletteFor(m), scale, ox || 0, oy || 0, pose);
  PROP_ORDER.forEach(k => {
    if (PROPS[k] && acc.indexOf(k) >= 0) stamp(ctx, PROPS[k].px, PROP_PAL, scale, ox || 0, oy || 0, pose);
  });
}

function drawGlyph(ctx, name, scale, x, y, alpha){
  const g = GLYPHS[name];
  if (!g) return;
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.fillStyle = g.c;
  for (let r = 0; r < g.px.length; r++)
    for (let c = 0; c < g.px[r].length; c++)
      if (g.px[r][c] === "#") ctx.fillRect((x + c) * scale, (y + r) * scale, scale, scale);
  ctx.globalAlpha = 1;
}

/* --- small static avatars, cached by look --- */
const memberKey = m => [m.species, m.hue | 0, (m.acc || []).join(",")].join("|");
const bitmaps = new Map();
function bitmapFor(m, scale){
  const key = memberKey(m) + "|" + scale;
  let c = bitmaps.get(key);
  if (!c){
    c = document.createElement("canvas");
    c.width = c.height = 16 * scale;
    paintMember(c.getContext("2d"), m, scale, 0, 0, FLAT);
    bitmaps.set(key, c);
  }
  return c;
}
function pixelScale(cssSize){
  const dpr = Math.max(1, Math.min(3, Math.round(window.devicePixelRatio || 1)));
  return Math.max(1, Math.round((cssSize * dpr) / 16));
}
function avatar(m, cssSize){
  const c = document.createElement("canvas");
  const s = pixelScale(cssSize);
  c.width = c.height = 16 * s;
  c.style.width = c.style.height = cssSize + "px";
  const ctx = c.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bitmapFor(m, s), 0, 0);
  return c;
}

/* ---------------------------------------------------------------------
   3. THE ANIMATOR
   Persistent moods (sleep / idle / work / happy / fight) plus one-shot
   signature moves. Everything is a function of seconds-in-state, so a
   dropped frame never leaves anybody stuck mid-pose.
--------------------------------------------------------------------- */
const R = Math.round, S = Math.sin, C = Math.cos, PI = Math.PI;
const bump = u => S(u * PI);

const MOVES = {
  rise:    { d:1.1, n:5, f:u => ({ hy:-R(bump(u)*4), by:-R(bump(u)*3) }) },
  stomp:   { d:0.95,n:4, f:u => {
               if (u < 0.45){ const c = u / 0.45; return { hy:-R(c*3), by:-R(c*3) }; }
               const j = Math.min(1, (u - 0.45) / 0.18);
               return { hy:R(j*1), by:R(j*1), shear:R(S(u*46)*(1-j)*2) }; } },
  spin:    { d:0.95,n:6, f:u => ({ shear:R(S(u*PI*2)*7), hy:-R(bump(u)) }) },
  lean:    { d:0.9, n:3, f:u => ({ shear:R(S(u*PI*2)*4), hx:R(S(u*PI*2)) }) },
  crouch:  { d:1.0, n:4, f:u => {
               if (u < 0.35){ const c = u / 0.35; return { hy:R(c*2), by:R(c) }; }
               const j = (u - 0.35) / 0.65, h = bump(j);
               return { hy:-R(h*5), by:-R(h*4), hx:R(h*2), bx:R(h*2) }; } },
  hop:     { d:1.0, n:4, f:u => { const h = Math.abs(S(u*PI*2)); return { hy:-R(h*4), by:-R(h*4) }; } },
  glitch:  { d:0.9, n:5, f:u => ({ hx:R(S(u*57)*2), hy:R(C(u*71)), shear:R(S(u*33)*3) }) },
  flap:    { d:0.9, n:6, f:u => { const h = S(u*PI*4);
               return { hy:-R(Math.abs(h)*3), by:-R(Math.abs(h)*2), shear:R(h*2) }; } },
  lunge:   { d:0.85,n:4, f:u => {
               const p = u < 0.3 ? -(u/0.3)*1.5 : (u < 0.55 ? ((u-0.3)/0.25)*4.5-1.5 : Math.max(0, 3-(u-0.55)*7));
               return { hx:R(p), bx:R(p*0.6), shear:R(p*1.1) }; } },
  dive:    { d:1.0, n:5, f:u => { const h = bump(u);
               return { hy:R(h*3), by:R(h), shear:-R(h*5), hx:R(h*3) }; } },
  wiggle:  { d:1.1, n:6, f:u => ({ shear:R(S(u*PI*8)*3), hx:R(S(u*PI*8)) }) },
  dash:    { d:0.85,n:5, f:u => { const k = R(S(u*PI*3)*4); return { hx:k, bx:k, shear:R(k*0.6) }; } },
  rear:    { d:1.25,n:7, f:u => {
               if (u < 0.35){ const c = u / 0.35; return { hy:-R(c*2), shear:-R(c*3) }; }
               const j = (u - 0.35) / 0.65;
               return { hy:-R((1-j)), shear:R(j*3), hx:R(j*2) }; } },
  scuttle: { d:1.0, n:4, f:u => { const k = R(S(u*PI*4)*4); return { hx:k, bx:k }; } },
  stretch: { d:1.7, n:3, f:u => { const h = bump(u);
               return { hy:-R(h*3), by:-R(h), shear:R(h*2) }; } }
};

/* deterministic scatter so glyphs do not jitter between frames */
function scatter(n, i){
  const a = S(i * 12.9898) * 43758.5453, b = S(i * 78.233) * 12345.6789;
  return { x: (a - Math.floor(a)) * 18 - 1, y: (b - Math.floor(b)) * 9 - 2 };
}

const FIELD = 22, ORIGIN_X = 3, ORIGIN_Y = 5;

/* Returns {pose, marks:[{g,x,y,a}]} for a mood at t seconds in. */
function frameFor(mood, t, sp){
  const marks = [];
  if (mood === "sleep"){
    const breathe = S(t * 1.15) > 0.55 ? -1 : 0;
    for (let i = 0; i < 3; i++){
      const ph = ((t * 0.42) + i * 0.34) % 1;
      marks.push({ g:"z", x: 13 + ph * 4, y: 4 - ph * 6, a: (1 - ph) * 0.9 });
    }
    return { pose:{ hy: 1 + breathe, by: 0, shear: 1 }, marks };
  }
  if (mood === "idle"){
    return { pose:{ hy: S(t * 1.7) > 0.55 ? -1 : 0 }, marks };
  }
  if (mood === "work"){
    const tick = Math.floor(t * 10) % 2;
    const nod = S(t * 2.1) > 0.75 ? -1 : 0;
    if (S(t * 3.1) > 0.93) marks.push({ g:"spark", x: 12, y: 9, a: 0.9 });
    return { pose:{ hy: nod - (tick ? 0 : 1), by: tick ? 0 : -1, shear: 0 }, marks };
  }
  if (mood === "happy"){
    const u = (t * 2.3) % 1, h = bump(u);
    for (let i = 0; i < 4; i++){
      const ph = ((t * 1.5) + i * 0.25) % 1;
      const p = scatter(4, i);
      marks.push({ g:"star", x: p.x, y: p.y + (1 - ph) * 2, a: S(ph * PI) });
    }
    return { pose:{ hy:-R(h*3), by:-R(h*3), shear: R(S(t*7)*2) }, marks };
  }
  if (mood === "fight"){
    const shake = S(t * 21);
    marks.push({ g:"bang", x: 13, y: -4, a: 0.75 + 0.25 * S(t * 9) });
    marks.push({ g:"bang", x: 1,  y: -3, a: 0.55 + 0.25 * S(t * 9 + 1) });
    return { pose:{ hx: 1 + R(shake), hy: 0, shear: 2 }, marks };
  }
  /* one-shot signature move */
  const mv = MOVES[mood] || MOVES.lean;
  const u = Math.max(0, Math.min(1, t / mv.d));
  for (let i = 0; i < mv.n; i++){
    const p = scatter(mv.n, i);
    const local = Math.max(0, Math.min(1, (u - i * 0.06) / 0.6));
    if (local > 0 && local < 1) marks.push({ g: sp.fx, x: p.x, y: p.y, a: S(local * PI) });
  }
  return { pose: mv.f(u), marks };
}

/* ---------------------------------------------------------------------
   4. TALKING TO A MODEL
   Three wire formats behind one async generator that yields
     {t:"text"}  visible answer      {t:"think"} reasoning, screen only
     {t:"meta"}  a note for the screen  {t:"stop"} stop_reason
   Nothing here depends on a library; it is fetch and a line reader.
--------------------------------------------------------------------- */
const ANTHROPIC_MODELS = [
  "claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5",
  "claude-opus-4-8", "claude-fable-5-1"
];

async function* readLines(res, signal){
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  try {
    for (;;){
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0, i).replace(/\r$/, "");
        buf = buf.slice(i + 1);
        if (line) yield line;
      }
    }
    if (buf.trim()) yield buf.trim();
  } finally {
    try { reader.cancel(); } catch (e) {}
  }
}

async function httpFail(res){
  let detail = "";
  try {
    const body = await res.text();
    try {
      const j = JSON.parse(body);
      detail = (j.error && (j.error.message || j.error)) || j.message || body;
    } catch (e) { detail = body; }
  } catch (e) {}
  const err = new Error("HTTP " + res.status + (detail ? " — " + String(detail).slice(0, 400) : ""));
  err.status = res.status;
  return err;
}

/* What went wrong, in words someone can act on. */
function diagnose(err, cfg){
  const p = cfg.provider;
  if (err && err.name === "AbortError") return null;
  const msg = String((err && err.message) || err);
  const network = (err instanceof TypeError) || /Failed to fetch|NetworkError|Load failed/i.test(msg);
  if (network && p === "ollama"){
    return "Couldn't reach Ollama at " + cfg.base + ".\n\n" +
      "Either it isn't running, or it is running and refused this page — Ollama only allows " +
      "localhost origins by default, and this page is served from " + (location.origin || "a file") + ".\n\n" +
      "Fixes: serve this page locally (`python3 -m http.server 8765`, then open http://localhost:8765), " +
      "or start Ollama with `OLLAMA_ORIGINS='*' ollama serve`.";
  }
  if (network){
    return "Couldn't reach " + cfg.base + ".\n\n" +
      "The server may be down, the URL wrong, or it may not send CORS headers that let a browser page call it.";
  }
  if (err && err.status === 401) return "The server rejected the API key (401). Check it in Settings.";
  if (err && err.status === 404) return "Nothing at that URL (404). Check the base URL and the model name in Settings.";
  if (err && err.status === 429) return "Rate limited (429). Wait a moment and try again.";
  return msg;
}

   6. MOOD
   `base` is the resting mood; one-shot moves and reactions fall back to
   it when they run out. Everything derives from seconds-in-state, so a
   dropped frame never leaves anybody stuck mid-pose.
--------------------------------------------------------------------- */
let mood = "idle", base = "idle", moodStart = performance.now(), lastPoke = Date.now();
const SLEEP_AFTER = 22000;

function setMood(m){ mood = m; moodStart = performance.now(); paintStage(); }
function setBase(b){
  base = b;
  if (!MOVES[mood] && mood !== "happy" && mood !== "fight") setMood(b);
}
function poke(){
  lastPoke = Date.now();
  if (base === "sleep" && !busy){ setBase("idle"); screenIdle(); }
}
const STATUS = { sleep:"asleep", idle:"waiting", work:"working", happy:"nailed it", fight:"that went badly" };
function paintStatus(){
  statusLine.textContent = STATUS[mood] || ((SPECIES[pet.species] || SPECIES.clawd).cry.toLowerCase() + "!");
  statusLine.className = "status" +
    (mood === "work" ? " work" : mood === "happy" ? " happy" : mood === "fight" ? " fight" : "");
}

const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
let stageScale = 8;
function sizeStage(){
  const box = $("#stage").getBoundingClientRect();
  const s = Math.max(4, Math.min(14, Math.floor(Math.min(box.width, box.height) / FIELD)));
  stageScale = s;
  const dpr = Math.max(1, Math.min(3, Math.round(window.devicePixelRatio || 1)));
  stageCv.width = FIELD * s * dpr;
  stageCv.height = FIELD * s * dpr;
  stageCv.style.width = (FIELD * s) + "px";
  stageCv.style.height = (FIELD * s) + "px";
  const ctx = stageCv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  paintStage();
}
function paintStage(){
  const ctx = stageCv.getContext("2d");
  const sp = SPECIES[pet.species] || SPECIES.clawd;
  let t = (performance.now() - moodStart) / 1000;
  if (reduced.matches && MOVES[mood]) t = MOVES[mood].d * 0.45;
  const f = frameFor(mood, t, sp);
  ctx.clearRect(0, 0, FIELD * stageScale, FIELD * stageScale);
  paintMember(ctx, pet, stageScale, ORIGIN_X, ORIGIN_Y, f.pose);
  f.marks.forEach(m => drawGlyph(ctx, m.g, stageScale, ORIGIN_X + m.x, ORIGIN_Y + m.y, m.a));
  paintStatus();
}
function loop(){
  const t = (performance.now() - moodStart) / 1000;
  const mv = MOVES[mood];
  if (mv && t > mv.d) setMood(base);
  else if ((mood === "happy" || mood === "fight") && t > 2.6) setMood(base);
  if (!busy && base !== "sleep" && Date.now() - lastPoke > SLEEP_AFTER && !MOVES[mood]){
    base = "sleep"; setMood("sleep"); screenIdle();
  }
  paintStage();
  requestAnimationFrame(loop);
}

/* ---------------------------------------------------------------------
   8. MARKDOWN - small, escapes first, no library
--------------------------------------------------------------------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const MARK = "@@MENAGERIE-CODE-";

function inline(s){
  s = s.replace(/`([^`\n]+)`/g, (m, c) => "<code>" + c + "</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}

function renderMarkdown(src, host){
  host.textContent = "";
  const blocks = [];
  const mark = i => MARK + i + "@@";
  let s = String(src).replace(/```([a-zA-Z0-9_+.-]*)[ \t]*\n?([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push({ lang: lang || "", code: code.replace(/\n$/, "") });
    return mark(blocks.length - 1);
  });
  /* a fence still being streamed has no closer yet - show it as code anyway */
  const open = s.match(/```([a-zA-Z0-9_+.-]*)[ \t]*\n?([\s\S]*)$/);
  if (open){
    blocks.push({ lang: open[1] || "", code: open[2] });
    s = s.slice(0, open.index) + mark(blocks.length - 1);
  }

  const lines = esc(s).split("\n");
  const PH = new RegExp("^" + MARK + "(\\d+)@@$");
  let i = 0, buf = [];
  const flush = () => {
    if (!buf.length) return;
    const p = document.createElement("p");
    p.innerHTML = inline(buf.join("<br>"));
    host.appendChild(p);
    buf = [];
  };
  while (i < lines.length){
    const line = lines[i];
    const ph = line.match(PH);
    if (ph){ flush(); host.appendChild(codeNode(blocks[+ph[1]])); i++; continue; }
    if (!line.trim()){ flush(); i++; continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h){
      flush();
      const n = document.createElement("h" + Math.min(3, h[1].length));
      n.innerHTML = inline(h[2]); host.appendChild(n); i++; continue;
    }
    if (/^&gt;\s?/.test(line)){
      flush();
      const q = document.createElement("blockquote"), rows = [];
      while (i < lines.length && /^&gt;\s?/.test(lines[i])){ rows.push(lines[i].replace(/^&gt;\s?/, "")); i++; }
      q.innerHTML = inline(rows.join("<br>")); host.appendChild(q); continue;
    }
    const bullet = /^\s*[-*+]\s+/, number = /^\s*\d+[.)]\s+/;
    if (bullet.test(line) || number.test(line)){
      flush();
      const ordered = number.test(line);
      const re = ordered ? number : bullet;
      const list = document.createElement(ordered ? "ol" : "ul");
      while (i < lines.length && re.test(lines[i])){
        const li = document.createElement("li");
        li.innerHTML = inline(lines[i].replace(re, ""));
        list.appendChild(li); i++;
      }
      host.appendChild(list); continue;
    }
    if (/^(---|\*\*\*|___)\s*$/.test(line)){ flush(); host.appendChild(document.createElement("hr")); i++; continue; }
    buf.push(line); i++;
  }
  flush();
}

function codeNode(b){
  const wrap = el("div", "code");
  const pre = document.createElement("pre");
  const code = document.createElement("code");
  code.textContent = b.code;
  pre.appendChild(code); wrap.appendChild(pre);
  if (b.lang) wrap.appendChild(el("span", "lang", b.lang));
  const cp = el("button", "cp", "copy");
  cp.type = "button";
  cp.addEventListener("click", () => copy(b.code, "Code copied"));
  wrap.appendChild(cp);
  return wrap;
}

async function copy(text, note){
  try { await navigator.clipboard.writeText(text); toast(note); }
  catch (e) {
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); toast(note); }
    catch (e2) { toast("Clipboard is blocked here"); }
    document.body.removeChild(t);
  }
}

--------------------------------------------------------------------- */
function cfgNow(){ return Object.assign({}, cfg, { apiKey: apiKey }); }

function buildMsgs(){
  const out = [];
  if (cfg.system && cfg.system.trim()) out.push({ role:"system", content: cfg.system.trim() });
  convo.forEach(m => {
    if (m.error) return;
    const t = (m.text || "").trim();
    if (!t) return;
    out.push({ role: m.role, content: t });
  });
  return out;
}

function setSendState(){
  const b = $("#sendBtn");
  b.textContent = busy ? "Stop" : "Send";
  b.classList.toggle("primary", !busy);
}

async function send(){
  if (busy){ if (current) current.abort(); return; }
  const text = sayIn.value.trim();
  if (!text) return;
  poke();

  convo.push({ id:uid(), role:"user", text: text });
  const asst = { id:uid(), role:"assistant", text:"", think:"" };
  convo.push(asst);
  liveMsg = asst;
  sayIn.value = ""; grow();
  renderMsgs(); pinBottom();

  busy = true;
  current = new AbortController();
  setSendState();
  setBase("work"); setMood("work");
  screenReset(text);

  const t0 = Date.now();
  let stopReason = null, got = false, aborted = false;
  try {
    const prov = PROVIDERS[cfg.provider] || PROVIDERS.demo;
    for await (const ev of prov.stream(cfgNow(), buildMsgs(), current.signal)){
      if (ev.t === "text"){ asst.text += ev.v; got = true; screenAdd("text", ev.v); scheduleLive(); }
      else if (ev.t === "think"){ asst.think += ev.v; screenAdd("think", ev.v); }
      else if (ev.t === "meta"){ screenAdd("note", "\n// " + ev.v + "\n"); }
      else if (ev.t === "stop"){ stopReason = ev.v; }
    }
    if (stopReason === "refusal"){
      asst.error = "The model declined to answer that one." +
        (got ? " Part of a reply arrived before it stopped." : "");
    } else if (!got){
      asst.error = "The model returned nothing. Check the model name in Settings.";
    }
  } catch (err){
    const msg = diagnose(err, cfgNow());
    if (msg === null){ aborted = true; }
    else { asst.error = msg; }
  } finally {
    busy = false; current = null; liveMsg = null;
    setSendState();
    const secs = ((Date.now() - t0) / 1000).toFixed(1);
    if (aborted){
      screenAdd("note", "\n// stopped after " + secs + "s\n");
      setBase("idle");
      if (!asst.text.trim()) convo.splice(convo.indexOf(asst), 1);
    } else if (asst.error){
      screenAdd("bad", "\n// " + String(asst.error).split("\n")[0] + "\n");
      setBase("idle"); setMood("fight");
      if (!asst.text.trim()) asst.text = "";
    } else {
      screenAdd("note", "\n// done in " + secs + "s\n");
      setBase("idle"); setMood("happy");
    }
    const stick = atBottom();
    renderMsgs();
    if (stick) pinBottom();
    save();
  }
}

function grow(){
  sayIn.style.height = "auto";
  sayIn.style.height = Math.min(190, sayIn.scrollHeight) + "px";
}
sayIn.addEventListener("input", () => { grow(); poke(); });
sayIn.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});
$("#sendBtn").addEventListener("click", send);

/* ---------------------------------------------------------------------
   11. THE DEN CONTROLS
--------------------------------------------------------------------- */
function renderPicker(){
  const host = $("#picker");
  host.textContent = "";
  SPECIES_KEYS.forEach(k => {
    const b = el("button", "pk");
    b.type = "button";
    b.title = SPECIES[k].label + " - " + SPECIES[k].cry;
    b.setAttribute("aria-pressed", String(pet.species === k));
    b.appendChild(avatar({ species:k, hue:0, acc:pet.acc }, 32));
    b.addEventListener("click", () => {
      pet.species = k;
      renderPicker(); renderMsgs(); signature(); save();
      $("#logo").replaceWith(logoCanvas());
    });
    host.appendChild(b);
  });
}
function renderProps(){
  const host = $("#props");
  host.textContent = "";
  PROP_KEYS.forEach(k => {
    const c = el("button", "chip", PROPS[k].label);
    c.type = "button";
    c.setAttribute("aria-pressed", String(pet.acc.indexOf(k) >= 0));
    c.addEventListener("click", () => {
      const i = pet.acc.indexOf(k);
      if (i >= 0) pet.acc.splice(i, 1); else pet.acc.push(k);
      poke(); renderProps(); renderPicker(); renderMsgs(); save();
    });
    host.appendChild(c);
  });
}
stageCv.addEventListener("click", signature);

function logoCanvas(){
  const c = avatar(pet, 32);
  c.id = "logo";
  return c;
}

/* ---------------------------------------------------------------------
   12. SETTINGS
--------------------------------------------------------------------- */
function setStatus(text, cls){
  $("#statusText").textContent = text;
  $("#statusDot").className = "dot " + (cls || "");
}

function pickDefaultModel(list){
  if (!list.length) return "";
  if (cfg.provider === "anthropic"){
    const want = list.find(m => m === "claude-opus-5") || list.find(m => /opus-5/.test(m));
    if (want) return want;
  }
  return list[0];
}

async function probe(quiet){
  const p = PROVIDERS[cfg.provider] || PROVIDERS.demo;
  if (!quiet) setStatus("looking...", "");
  try {
    const list = await p.models(cfgNow());
    if (!cfg.model || list.indexOf(cfg.model) < 0) cfg.model = pickDefaultModel(list) || cfg.model;
    setStatus(p.label + (cfg.model ? " - " + cfg.model : ""), cfg.provider === "demo" ? "demo" : "on");
    save();
    return list;
  } catch (e){
    setStatus(p.label + " unreachable", "off");
    return null;
  }
}

function openSettings(on){
  $("#settings").classList.toggle("on", on);
  $("#scrim").classList.toggle("on", on);
  if (on) buildSettings();
}

function buildSettings(){
  const host = $("#setBody");
  host.textContent = "";
  const p = PROVIDERS[cfg.provider] || PROVIDERS.demo;

  /* provider */
  const f0 = el("div", "field");
  f0.appendChild(el("label", null, "Where replies come from"));
  const seg = el("div", "seg");
  [["ollama","Ollama"],["openai","OpenAI-ish"],["anthropic","Anthropic"],["demo","Demo"]].forEach(([k, lbl]) => {
    const b = el("button", null, lbl);
    b.type = "button";
    b.setAttribute("aria-pressed", String(cfg.provider === k));
    b.addEventListener("click", () => {
      const wasDefault = !cfg.base || cfg.base === (PROVIDERS[cfg.provider] || {}).base;
      cfg.provider = k;
      if (wasDefault) cfg.base = PROVIDERS[k].base;
      cfg.model = "";
      save(); buildSettings(); probe(); screenIdle();
    });
    seg.appendChild(b);
  });
  f0.appendChild(seg);
  f0.appendChild(el("div", "note", p.hint));
  host.appendChild(f0);

  /* base url */
  if (cfg.provider !== "demo"){
    const f1 = el("div", "field");
    f1.appendChild(el("label", null, "Base URL"));
    const inp = el("input", "in");
    inp.value = cfg.base; inp.spellcheck = false;
    inp.addEventListener("change", () => { cfg.base = inp.value.trim(); save(); probe(); });
    f1.appendChild(inp);
    host.appendChild(f1);
  }

  /* api key */
  if (p.key){
    const f2 = el("div", "field");
    f2.appendChild(el("label", null, "API key" + (p.key === "optional" ? " (optional)" : "")));
    const row = el("div", "row2");
    const inp = el("input", "in");
    inp.type = "password"; inp.value = apiKey; inp.placeholder = "paste your key";
    inp.autocomplete = "off"; inp.spellcheck = false;
    inp.addEventListener("change", () => { apiKey = inp.value.trim(); saveKey(); probe(); });
    row.appendChild(inp);
    const forget = el("button", "btn", "Forget");
    forget.type = "button";
    forget.style.flex = "0 0 auto";
    forget.addEventListener("click", () => { apiKey = ""; saveKey(); buildSettings(); toast("Key removed from this browser"); });
    row.appendChild(forget);
    f2.appendChild(row);
    const warn = el("div", "warn");
    warn.innerHTML = "<b>The key stays in this browser</b> (localStorage) and goes straight from here to " +
      esc(cfg.base) + ". Nothing passes through any server of mine. Do not paste a key into a copy of this " +
      "page that other people can open, and use a key you can revoke.";
    f2.appendChild(warn);
    host.appendChild(f2);
  }

  /* model */
  const f3 = el("div", "field");
  f3.appendChild(el("label", null, "Model"));
  const row3 = el("div", "row2");
  const mi = el("input", "in");
  mi.value = cfg.model; mi.spellcheck = false; mi.setAttribute("list", "modelList");
  mi.addEventListener("change", () => { cfg.model = mi.value.trim(); save(); probe(true); });
  row3.appendChild(mi);
  const refresh = el("button", "btn", "List");
  refresh.type = "button"; refresh.style.flex = "0 0 auto";
  refresh.addEventListener("click", async () => {
    refresh.textContent = "...";
    const list = await probe();
    refresh.textContent = "List";
    if (!list){ toast("Could not reach " + cfg.base); return; }
    fillModels(list);
    mi.value = cfg.model;
    toast(list.length + " model" + (list.length === 1 ? "" : "s") + " found");
  });
  row3.appendChild(refresh);
  f3.appendChild(row3);
  const dl = document.createElement("datalist");
  dl.id = "modelList";
  f3.appendChild(dl);
  host.appendChild(f3);

  /* system prompt */
  const f4 = el("div", "field");
  f4.appendChild(el("label", null, "System prompt"));
  const ta = el("textarea", "in");
  ta.value = cfg.system;
  ta.addEventListener("change", () => { cfg.system = ta.value; save(); });
  f4.appendChild(ta);
  host.appendChild(f4);

  /* knobs */
  if (p.temp){
    const f5 = el("div", "field");
    f5.appendChild(el("label", null, "Temperature - " + cfg.temp));
    const r = document.createElement("input");
    r.type = "range"; r.min = 0; r.max = 2; r.step = 0.1; r.value = cfg.temp;
    r.className = "in"; r.style.padding = "0";
    r.addEventListener("input", () => {
      cfg.temp = +r.value;
      f5.querySelector("label").textContent = "Temperature - " + cfg.temp;
      save();
    });
    f5.appendChild(r);
    host.appendChild(f5);
  }
  if (cfg.provider === "anthropic"){
    const f6 = el("div", "field");
    f6.appendChild(el("label", null, "Max tokens"));
    const n = el("input", "in");
    n.type = "number"; n.min = 1024; n.max = 128000; n.step = 1024; n.value = cfg.maxTokens;
    n.addEventListener("change", () => { cfg.maxTokens = Math.max(1024, +n.value || 64000); save(); });
    f6.appendChild(n);
    f6.appendChild(el("div", "note",
      "Streaming with adaptive thinking on, so give it room. Thinking summaries land on the laptop screen, not in the chat."));
    host.appendChild(f6);
  }

  /* footer */
  const f7 = el("div", "field");
  const test = el("button", "btn", "Test the connection");
  test.type = "button";
  test.addEventListener("click", async () => {
    test.textContent = "Testing...";
    const list = await probe();
    test.textContent = "Test the connection";
    toast(list ? "Reached it - " + list.length + " model" + (list.length === 1 ? "" : "s") : "No answer from " + cfg.base);
  });
  f7.appendChild(test);
  host.appendChild(f7);

  const f8 = el("div", "field");
  f8.innerHTML = '<div class="note">Also in this repo: <a href="transcript.html">the transcript maker</a> ' +
    '- write a scene and cast it with the same animals.</div>';
  host.appendChild(f8);

  probe(true).then(list => { if (list) fillModels(list); });
}

function fillModels(list){
  const dl = document.getElementById("modelList");
  if (!dl) return;
  dl.textContent = "";
  list.forEach(m => { const o = document.createElement("option"); o.value = m; dl.appendChild(o); });
}

$("#setBtn").addEventListener("click", () => openSettings(true));
$("#setClose").addEventListener("click", () => openSettings(false));
$("#scrim").addEventListener("click", () => { openSettings(false); denDrawer(false); });
$("#statusPill").addEventListener("click", () => openSettings(true));

function denDrawer(on){
  $("#den").classList.toggle("on", on);
  $("#scrim").classList.toggle("on", on);
  if (on) sizeStage();
}
$("#denToggle").addEventListener("click", () => denDrawer(!$("#den").classList.contains("on")));

$("#newBtn").addEventListener("click", () => {
  if (convo.length && !confirm("Clear this conversation?")) return;
  if (current) current.abort();
  convo = []; renderMsgs(); save(); screenIdle(); poke();
});

const THEMES = ["", "light", "dark"];
$("#themeBtn").addEventListener("click", () => {
  const now = document.documentElement.dataset.theme || "";
  const next = THEMES[(THEMES.indexOf(now) + 1) % THEMES.length];
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEMEKEY, next); } catch (e) {}
  toast(next ? next + " theme" : "following your system");
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ openSettings(false); denDrawer(false); }
});
document.addEventListener("pointerdown", poke, { passive:true });
window.addEventListener("resize", sizeStage);

/* ---------------------------------------------------------------------
   13. BOOT
--------------------------------------------------------------------- */
function load(){
  try {
    const t = localStorage.getItem(THEMEKEY);
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) {}
  try { apiKey = localStorage.getItem(KEYSTORE) || ""; } catch (e) {}
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { raw = null; }
  if (raw && typeof raw === "object"){
    if (raw.cfg) cfg = Object.assign({}, DEFAULTS, raw.cfg);
    if (!PROVIDERS[cfg.provider]) cfg.provider = "ollama";
    if (raw.pet && SPECIES[raw.pet.species]){
      pet.species = raw.pet.species;
      pet.hue = raw.pet.hue | 0;
      pet.acc = Array.isArray(raw.pet.acc) ? raw.pet.acc.filter(k => PROPS[k]) : ["laptop"];
    }
    if (Array.isArray(raw.convo)){
      convo = raw.convo.filter(m => m && (m.role === "user" || m.role === "assistant"))
        .map(m => ({ id:uid(), role:m.role, text:String(m.text || ""), think:String(m.think || ""), error:m.error || null }));
    }
    return true;
  }
  return false;
}

async function firstRunDetect(){
  for (const p of ["ollama", "openai"]){
    cfg.provider = p; cfg.base = PROVIDERS[p].base;
    const list = await probe(true);
    if (list && list.length){ save(); return; }
  }
  cfg.provider = "demo"; cfg.base = ""; cfg.model = "scripted";
  save();
  setStatus("Demo - no model attached", "demo");
}

async function boot(){
  const had = load();
  $("#logo").replaceWith(logoCanvas());
  renderPicker(); renderProps(); renderMsgs();
  sizeStage(); screenIdle(); grow();
  requestAnimationFrame(loop);
  if (had) await probe(); else await firstRunDetect();
  screenIdle();
}
boot();
</script>
