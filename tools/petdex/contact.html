<!doctype html><meta charset="utf-8"><title>petdex roster</title>
<style>
 body{margin:0;background:#241f1b;color:#e8e0d4;font:11px ui-monospace,monospace;padding:6px}
 .grid{display:flex;flex-wrap:wrap;gap:4px}
 .cell{width:118px;text-align:center}
 .fr{width:96px;height:104px;margin:0 auto;image-rendering:pixelated;
     background-size:768px 936px;outline:1px solid #3a352f}
 .n{padding-top:2px;color:#c8bfae}
 .s{color:#7e7466;font-size:10px}
</style>
<div class="grid" id="g"></div>
<script>
const PETS=[["ember","Ember"],["chomp","Chomp"],["waddle","Waddle"],["squish","Squish"],
["zoom","Zoom"],["pinch","Pinch"],["doze","Doze"],["pip","Pip"],["rex","Rex"],
["stripe","Stripe"],["dev","Dev"],["mochi","Mochi"],["pesto","Pesto"],["bolt","Bolt"],
["otto","Otto"],["biscuit","Biscuit"],["barley","Barley"]];
const ROW=(new URLSearchParams(location.search)).get('row')|0;
const NAMES=["idle","running-right","running-left","waving","jumping","failed","waiting","running","review"];
const g=document.getElementById('g');
PETS.forEach(([id,name])=>{
  const c=document.createElement('div');c.className='cell';
  const f=document.createElement('div');f.className='fr';
  f.style.backgroundImage="url(../../pets/"+id+"/spritesheet.png)";
  f.style.backgroundPosition=(-0*96)+"px "+(-ROW*104)+"px";
  c.appendChild(f);
  const n=document.createElement('div');n.className='n';n.textContent=name;c.appendChild(n);
  const s=document.createElement('div');s.className='s';s.textContent=NAMES[ROW];c.appendChild(s);
  g.appendChild(c);
});
</script>
